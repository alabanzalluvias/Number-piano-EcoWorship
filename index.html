<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vocal TAB: Guía de Escalas</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505; 
            --text-color: #f8fafc;
            
            --white-key: #ffffff;
            --black-key: #0f0f11;
            --white-key-text: #09090b;
            --black-key-text: #ffffff;
            --piano-bg: rgba(24, 24, 27, 0.6);

            --main-active: #8b5cf6;   
            --upper-active: #be123c;  
            --lower-active: #4338ca;  
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top, #18181b 0%, var(--bg-color) 100%);
            color: var(--text-color);
            margin: 0;
            padding: 30px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-weight: 800;
            font-size: 2rem;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #a78bfa, #f472b6, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            font-size: 14px;
            font-weight: 600;
            color: #a1a1aa;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }
        .legend span { display: flex; align-items: center; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        
        .dot.lower { background-color: var(--lower-active); }
        .dot.main { background-color: var(--main-active); box-shadow: 0 0 10px var(--main-active); }
        .dot.upper { background-color: var(--upper-active); }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
            justify-content: center;
            width: 100%;
            max-width: 600px;
        }

        select {
            flex: 1 1 45%; 
            min-width: 120px;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background-color: rgba(24, 24, 27, 0.8);
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        select:focus {
            border-color: var(--main-active);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
            transform: translateY(-2px);
        }

        .scale-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #e4e4e7; 
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(139, 92, 246, 0.5);
        }

        .piano-scroll-wrapper {
            width: 100%;
            max-width: 1000px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 20px; 
            scrollbar-width: thin;
            scrollbar-color: #52525b transparent;
        }

        .piano {
            display: flex;
            position: relative;
            background: var(--piano-bg);
            padding: 6px;
            border-radius: 12px;
            width: max-content;
            margin: 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .key-wrapper {
            position: relative;
            display: flex; 
        }

        .key {
            display: flex;
            position: relative; 
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 12px; 
            box-sizing: border-box;
            user-select: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent; 
            touch-action: pan-x pan-y; 
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .key.white {
            width: 48px; 
            height: 190px; 
            background: linear-gradient(to bottom, #ffffff 0%, #f4f4f5 100%);
            color: var(--white-key-text); 
            border: 1px solid #d4d4d8;
            border-bottom: 4px solid #a1a1aa;
            border-radius: 0 0 6px 6px;
            margin-right: 2px;
        }

        .key.black {
            width: 32px;
            height: 115px;
            background: linear-gradient(to bottom, #18181b 0%, #09090b 100%);
            color: var(--black-key-text); 
            position: absolute;
            top: 0;
            left: 33px; 
            border-radius: 0 0 6px 6px;
            z-index: 5; /* Aumentado para asegurar que siempre esté por encima de la luz */
            border: 1px solid #000000;
            border-bottom: 3px solid #000000;
            box-shadow: 2px 5px 10px rgba(0,0,0,0.7); 
        }

        /* EFECTO DE ILUMINACIÓN CORREGIDO */
        .key.pressed::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.3);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.6);
            border-radius: inherit;
            pointer-events: none;
        }

        .note-name, .degree {
            pointer-events: none; 
        }

        .note-name {
            font-size: 12px;
            font-weight: 700;
            opacity: 0.8;
            line-height: 1;
            margin-bottom: 4px;
        }
        .degree {
            font-size: 18px;
            font-weight: 800;
            line-height: 1;
        }
        .key.black .note-name { font-size: 11px; margin-bottom: 3px; }
        .key.black .degree { font-size: 15px; }

        /* OCTAVA PRINCIPAL */
        .key.white.active.main { 
            background: var(--main-active); color: #ffffff; border-color: #6d28d9; border-bottom-color: #4c1d95;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4), inset 0 -10px 20px rgba(0,0,0,0.2); 
        }
        .key.black.active.main { 
            background: linear-gradient(to bottom, var(--main-active), #6d28d9); color: #ffffff; border-color: #4c1d95; 
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.5);
        }
        
        /* OCTAVA SUPERIOR */
        .key.white.active.upper { 
            background: var(--upper-active); color: #e4e4e7; border-color: #881337; border-bottom-color: #4c0519;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.3);
        }
        .key.black.active.upper { 
            background: linear-gradient(to bottom, #e11d48, var(--upper-active)); color: #e4e4e7; border-color: #881337; border-bottom-color: #4c0519;
            box-shadow: 2px 5px 10px rgba(0,0,0,0.7);
        }
        
        /* OCTAVA INFERIOR */
        .key.white.active.lower { 
            background: var(--lower-active); color: #e4e4e7; border-color: #3730a3; border-bottom-color: #1e1b4b;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.3);
        }
        .key.black.active.lower { 
            background: linear-gradient(to bottom, #4f46e5, var(--lower-active)); color: #e4e4e7; border-color: #312e81; border-bottom-color: #1e1b4b;
            box-shadow: 2px 5px 10px rgba(0,0,0,0.7);
        }
        
        .key:active { transform: translateY(2px); border-bottom-width: 2px; }
        .key.black:active { border-bottom-width: 1px; }

        .footer-signature {
            margin-top: 40px;
            font-size: 0.85rem;
            font-weight: 400;
            color: #71717a;
            letter-spacing: 0.5px;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }
        .footer-signature:hover {
            opacity: 1;
        }
        .footer-signature .name {
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

    </style>
</head>
<body>

    <h1>Guía de Escalas Voces EcoWorship</h1>

    <div class="legend">
        <span><div class="dot lower"></div> Graves (-1)</span>
        <span><div class="dot main"></div> Melodía (1)</span>
        <span><div class="dot upper"></div> Agudos (1+)</span>
    </div>

    <div class="controls">
        <select id="note-selector">
            <option value="0" data-letter="C">Do (C)</option>
            <option value="2" data-letter="D">Re (D)</option>
            <option value="4" data-letter="E">Mi (E)</option>
            <option value="5" data-letter="F">Fa (F)</option>
            <option value="7" data-letter="G">Sol (G)</option>
            <option value="9" data-letter="A">La (A)</option>
            <option value="11" data-letter="B">Si (B)</option>
        </select>

        <select id="accidental-selector">
            <option value="0" data-char="">Natural (♮)</option>
            <option value="-1" data-char="b">Bemol (b)</option>
            <option value="1" data-char="#">Sostenido (#)</option>
        </select>

        <select id="type-selector">
            <option value="Mayor">Mayor</option>
            <option value="Menor (Natural)">Menor (Natural)</option>
            <option value="Menor (Armónica)">Menor (Armónica)</option>
            <option value="Pentatónica Mayor">Pentatónica Mayor</option>
            <option value="Pentatónica Menor">Pentatónica Menor</option>
        </select>

        <select id="octave-selector">
            <option value="1">Octava 2 (C2)</option>
            <option value="2" selected>Octava 3 (Central)</option>
            <option value="3">Octava 4 (C4)</option>
        </select>
    </div>

    <div id="scale-title" class="scale-title">Escala Mayor de C</div>

    <div class="piano-scroll-wrapper" id="scroll-wrapper">
        <div class="piano" id="piano-container"></div>
    </div>

    <div class="footer-signature">
        By: <span class="name">Luis Guarin</span>
    </div>

    <script>
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(noteIndex) {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const midiNote = 36 + noteIndex;
            const frequency = 440 * Math.pow(2, (midiNote - 69) / 12);

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'triangle'; 
            oscillator.frequency.value = frequency;

            const now = audioCtx.currentTime;
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.6, now + 0.02); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 1.5); 

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start(now);
            oscillator.stop(now + 1.5); 
        }

        const formulas = {
            "Mayor": [0, 2, 4, 5, 7, 9, 11],     
            "Menor (Natural)": [0, 2, 3, 5, 7, 8, 10],     
            "Menor (Armónica)": [0, 2, 3, 5, 7, 8, 11],
            "Pentatónica Mayor": [0, 2, 4, 7, 9],
            "Pentatónica Menor": [0, 3, 5, 7, 10]
        };

        const letters = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
        
        const intervalToDiatonicStep = {
            0: 0, 
            1: 1, 2: 1, 
            3: 2, 4: 2, 
            5: 3, 6: 3, 
            7: 4, 
            8: 5, 9: 5, 
            10: 6, 11: 6 
        };

        const pitchMap = {
            0: ['C', 'B#', 'Dbb'],
            1: ['Db', 'C#', 'Bx'],
            2: ['D', 'Cx', 'Ebb'],
            3: ['Eb', 'D#', 'Fbb'],
            4: ['E', 'Fb', 'Dx'],
            5: ['F', 'E#', 'Gbb'],
            6: ['Gb', 'F#', 'Ex'],
            7: ['G', 'Fx', 'Abb'],
            8: ['Ab', 'G#'],
            9: ['A', 'Gx', 'Bbb'],
            10: ['Bb', 'A#', 'Cbb'],
            11: ['B', 'Cb', 'Ax']
        };

        const pianoContainer = document.getElementById('piano-container');
        const scrollWrapper = document.getElementById('scroll-wrapper');
        
        const numOctaves = 5; 
        const totalNotes = numOctaves * 12 + 1; 
        const blackKeyIndices = [1, 3, 6, 8, 10]; 

        function bindPressEffect(element) {
            element.addEventListener('pointerdown', () => element.classList.add('pressed'));
            element.addEventListener('pointerup', () => element.classList.remove('pressed'));
            element.addEventListener('pointerleave', () => element.classList.remove('pressed'));
            element.addEventListener('pointercancel', () => element.classList.remove('pressed'));
        }

        for (let i = 0; i < totalNotes; i++) {
            const noteInOctave = i % 12;
            const isBlack = blackKeyIndices.includes(noteInOctave);

            if (!isBlack) {
                const wrapper = document.createElement('div');
                wrapper.className = 'key-wrapper';

                const whiteKey = document.createElement('div');
                whiteKey.className = 'key white';
                whiteKey.dataset.note = i;
                whiteKey.addEventListener('pointerdown', () => playSound(i));
                bindPressEffect(whiteKey); 
                wrapper.appendChild(whiteKey);

                const nextNote = i + 1;
                const nextNoteInOctave = nextNote % 12;
                
                if (nextNote < totalNotes && blackKeyIndices.includes(nextNoteInOctave)) {
                    const blackKey = document.createElement('div');
                    blackKey.className = 'key black';
                    blackKey.dataset.note = nextNote;
                    blackKey.addEventListener('pointerdown', () => playSound(nextNote));
                    bindPressEffect(blackKey); 
                    wrapper.appendChild(blackKey);
                }
                pianoContainer.appendChild(wrapper);
            }
        }

        const noteSelector = document.getElementById('note-selector');
        const accidentalSelector = document.getElementById('accidental-selector');
        const typeSelector = document.getElementById('type-selector');
        const octaveSelector = document.getElementById('octave-selector');
        const scaleTitle = document.getElementById('scale-title');

        function centerPianoOnNote(noteIndex) {
            const keyElement = document.querySelector(`.key[data-note="${noteIndex}"]`);
            if (keyElement) {
                const wrapperElement = keyElement.closest('.key-wrapper');
                if (wrapperElement) {
                    const scrollTarget = wrapperElement.offsetLeft - (scrollWrapper.clientWidth / 2) + (wrapperElement.clientWidth / 2);
                    scrollWrapper.scrollTo({
                        left: scrollTarget,
                        behavior: 'smooth'
                    });
                }
            }
        }

        function renderScale() {
            const basePitch = parseInt(noteSelector.value);
            const accidentalOffset = parseInt(accidentalSelector.value);
            const rootPitch = (basePitch + accidentalOffset + 12) % 12;
            
            const scaleType = typeSelector.value;
            const baseOctave = parseInt(octaveSelector.value);
            const currentFormula = formulas[scaleType];

            const selectedNoteOption = noteSelector.options[noteSelector.selectedIndex];
            const rootLetter = selectedNoteOption.dataset.letter;
            const rootLetterIndex = letters.indexOf(rootLetter);
            const accidentalChar = accidentalSelector.options[accidentalSelector.selectedIndex].dataset.char;
            
            scaleTitle.textContent = `Escala ${scaleType} de ${rootLetter}${accidentalChar}`;

            document.querySelectorAll('.key').forEach(key => {
                key.className = key.className.replace(/active|main|upper|lower/g, '').trim();
                key.innerHTML = ''; 
            });

            for (let octOffset = -1; octOffset <= 1; octOffset++) {
                const rootIndex = (baseOctave + octOffset) * 12 + rootPitch;
                const activeNotes = currentFormula.map(interval => rootIndex + interval);

                activeNotes.forEach((noteIndex, i) => {
                    const keyElement = document.querySelector(`.key[data-note="${noteIndex}"]`);
                    
                    if (keyElement) {
                        keyElement.classList.add('active');
                        
                        const degreeNum = i + 1;
                        let degreeText = degreeNum;
                        if (octOffset === 1) degreeText = degreeNum + '+';
                        else if (octOffset === -1) degreeText = '-' + degreeNum;

                        const chromaticInterval = currentFormula[i];
                        const diatonicStep = intervalToDiatonicStep[chromaticInterval];
                        
                        const expectedLetterIndex = (rootLetterIndex + diatonicStep) % 7;
                        const expectedLetter = letters[expectedLetterIndex];
                        const actualPitch = noteIndex % 12;
                        
                        let noteName = pitchMap[actualPitch].find(n => n.startsWith(expectedLetter));
                        if (!noteName) noteName = pitchMap[actualPitch][0]; 

                        if (octOffset === 0) keyElement.classList.add('main');
                        else if (octOffset === 1) keyElement.classList.add('upper');
                        else if (octOffset === -1) keyElement.classList.add('lower');

                        keyElement.innerHTML = `<span class="note-name">${noteName}</span><span class="degree">${degreeText}</span>`;
                    }
                });
            }

            const mainTonicIndex = (baseOctave * 12) + rootPitch;
            setTimeout(() => centerPianoOnNote(mainTonicIndex), 50); 
        }

        window.addEventListener('resize', () => {
            setTimeout(() => {
                renderScale();
            }, 150); 
        });

        noteSelector.addEventListener('change', renderScale);
        accidentalSelector.addEventListener('change', renderScale);
        typeSelector.addEventListener('change', renderScale);
        octaveSelector.addEventListener('change', renderScale);

        setTimeout(renderScale, 50);
    </script>
</body>
</html>
