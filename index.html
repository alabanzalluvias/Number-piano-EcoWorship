<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vocal TAB: Guía de Escalas</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505; 
            --text-color: #f8fafc;
            
            --white-key: #ffffff;
            --black-key: #0f0f11;
            --white-key-text: #09090b;
            --black-key-text: #ffffff;
            --piano-bg: rgba(24, 24, 27, 0.6);

            --main-active: #a78bfa;   
            --upper-active: #fb7185;  
            --lower-active: #818cf8;  
            
            --tessitura-color: #38bdf8; 
            --tuner-perfect: #22c55e; 
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top, #18181b 0%, var(--bg-color) 100%);
            color: var(--text-color);
            margin: 0;
            padding: 30px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100dvh; 
        }

        h1 {
            font-weight: 800;
            font-size: 2rem;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #a78bfa, #f472b6, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 600;
            color: #a1a1aa;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            justify-content: center;
        }
        .legend span { display: flex; align-items: center; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        
        .dot.lower { background-color: var(--lower-active); box-shadow: 0 0 8px var(--lower-active); }
        .dot.main { background-color: var(--main-active); box-shadow: 0 0 12px var(--main-active); }
        .dot.upper { background-color: var(--upper-active); box-shadow: 0 0 8px var(--upper-active); }
        .dot.tessitura { background-color: var(--tessitura-color); border-radius: 2px; height: 4px; width: 16px; box-shadow: 0 0 8px var(--tessitura-color);}

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            justify-content: center;
            width: 100%;
            max-width: 600px;
        }

        select {
            flex: 1 1 45%; 
            min-width: 120px;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background-color: rgba(24, 24, 27, 0.8);
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        #voice-selector, #main-instrument { flex: 1 1 100%; }
        #voice-selector { border-color: rgba(56, 189, 248, 0.3); color: #bae6fd; }
        #main-instrument { border-color: rgba(167, 139, 250, 0.3); color: #ddd6fe; }

        select:focus {
            border-color: var(--main-active);
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.3);
            transform: translateY(-2px);
        }

        .switches-wrapper {
            display: flex;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }
        
        .switch-container { display: flex; align-items: center; gap: 10px; }
        .switch-label { font-size: 15px; font-weight: 600; color: #d4d4d8; }
        .switch { position: relative; display: inline-block; width: 48px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #3f3f46; transition: .4s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        
        input:checked + .slider { background-color: var(--main-active); box-shadow: 0 0 12px rgba(167, 139, 250, 0.5); }
        #tuner-toggle:checked + .slider { background-color: var(--tuner-perfect); box-shadow: 0 0 12px rgba(34, 197, 94, 0.5); }
        input:checked + .slider:before { transform: translateX(22px); }

        .tuner-panel {
            width: 100%;
            max-width: 800px;
            background: rgba(24, 24, 27, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px 25px;
            margin-bottom: 20px;
            display: none; 
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }
        .tuner-panel.active { display: flex; }
        
        .tuner-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
        }

        .tuner-note-display {
            font-size: 2.5rem;
            font-weight: 800;
            color: #52525b; 
            line-height: 1;
            transition: color 0.2s;
        }

        .tuner-status {
            font-size: 0.95rem;
            font-weight: 700;
            color: #71717a;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 8px;
        }

        .tuner-gauge-blob {
            width: 100%;
            height: 24px;
            background: rgba(0,0,0,0.6);
            border-radius: 12px;
            position: relative;
            border: 1px solid #3f3f46;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        
        .tuner-gauge-blob::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0; bottom: 0;
            width: 2px;
            background: rgba(255,255,255,0.3);
            transform: translateX(-50%);
            z-index: 1;
        }

        .tuner-blob {
            position: absolute;
            top: 3px; bottom: 3px;
            width: 44px;
            border-radius: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #52525b;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: background-color 0.2s, box-shadow 0.2s;
            z-index: 2;
        }
        
        .tuner-labels {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 8px;
            font-size: 11px;
            font-weight: 700;
            color: #71717a;
            text-transform: uppercase;
        }

        .scale-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #e4e4e7; 
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(167, 139, 250, 0.5);
        }

        .piano-scroll-wrapper {
            width: 100%; max-width: 1000px; overflow-x: auto;
            -webkit-overflow-scrolling: touch; padding-bottom: 20px; 
            scrollbar-width: thin; scrollbar-color: #52525b transparent;
        }

        .piano {
            display: flex; position: relative; background: var(--piano-bg);
            padding: 6px; border-radius: 12px; width: max-content; margin: 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .key-wrapper { position: relative; display: flex; }

        .key {
            display: flex; position: relative; flex-direction: column;
            justify-content: flex-end; align-items: center; padding-bottom: 12px; 
            box-sizing: border-box; user-select: none; cursor: pointer;
            -webkit-tap-highlight-color: transparent; touch-action: pan-x pan-y; 
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .key.white {
            width: 48px; height: 190px; 
            background: linear-gradient(to bottom, #ffffff 0%, #f4f4f5 100%);
            color: var(--white-key-text); border: 1px solid #d4d4d8;
            border-bottom: 4px solid #a1a1aa; border-radius: 0 0 6px 6px; margin-right: 2px;
            z-index: 1; 
        }

        .key.black {
            width: 32px; height: 115px;
            background: linear-gradient(to bottom, #18181b 0%, #09090b 100%);
            color: var(--black-key-text); position: absolute; top: 0; left: 33px; 
            border-radius: 0 0 6px 6px; 
            z-index: 5; 
            border: 1px solid #000000;
            border-bottom: 3px solid #000000; box-shadow: 2px 5px 10px rgba(0,0,0,0.7); 
        }

        .key.voice-active { border-color: #4ade80 !important; }
        
        .key.voice-active::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(34, 197, 94, 0.65) !important;
            box-shadow: inset 0 0 25px rgba(34, 197, 94, 1), 0 0 15px rgba(34, 197, 94, 0.5) !important;
            border-radius: inherit; pointer-events: none; 
            z-index: 10; 
        }
        
        .key.black.voice-active::after { 
            background: rgba(34, 197, 94, 0.8) !important; 
            box-shadow: inset 0 0 15px rgba(34, 197, 94, 1), 0 0 20px rgba(34, 197, 94, 0.6) !important;
        }

        .key.tessitura::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(56, 189, 248, 0.15) 0%, transparent 60%);
            border-top: 4px solid var(--tessitura-color); border-radius: inherit; pointer-events: none; z-index: 2; 
        }
        .key.black.tessitura::before {
            border-top: 3px solid var(--tessitura-color);
            background: linear-gradient(to bottom, rgba(56, 189, 248, 0.3) 0%, transparent 60%);
        }

        .key.pressed::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.3); box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.6);
            border-radius: inherit; pointer-events: none; z-index: 3;
        }

        .note-name, .degree { pointer-events: none; z-index: 4; position: relative; }
        .note-name { font-size: 12px; font-weight: 700; opacity: 0.9; line-height: 1; margin-bottom: 4px; }
        .degree { font-size: 18px; font-weight: 800; line-height: 1; }
        .key.black .note-name { font-size: 11px; margin-bottom: 3px; }
        .key.black .degree { font-size: 15px; }
        
        .key.white.active.main { background: var(--main-active); color: #ffffff; border-color: #8b5cf6; border-bottom-color: #7c3aed; box-shadow: 0 0 25px rgba(167, 139, 250, 0.7), inset 0 2px 10px rgba(255, 255, 255, 0.4); }
        .key.black.active.main { background: linear-gradient(to bottom, #c084fc, var(--main-active)); color: #ffffff; border-color: #7c3aed; box-shadow: 0 5px 20px rgba(167, 139, 250, 0.8); }
        .key.white.active.upper { background: var(--upper-active); color: #ffffff; border-color: #f43f5e; border-bottom-color: #e11d48; box-shadow: 0 0 15px rgba(251, 113, 133, 0.5), inset 0 2px 10px rgba(255, 255, 255, 0.3); }
        .key.black.active.upper { background: linear-gradient(to bottom, #fda4af, var(--upper-active)); color: #ffffff; border-color: #e11d48; box-shadow: 0 5px 15px rgba(251, 113, 133, 0.6); }
        .key.white.active.lower { background: var(--lower-active); color: #ffffff; border-color: #6366f1; border-bottom-color: #4f46e5; box-shadow: 0 0 15px rgba(129, 140, 248, 0.5), inset 0 2px 10px rgba(255, 255, 255, 0.3); }
        .key.black.active.lower { background: linear-gradient(to bottom, #a5b4fc, var(--lower-active)); color: #ffffff; border-color: #4f46e5; box-shadow: 0 5px 15px rgba(129, 140, 248, 0.6); }
        
        .key:active { transform: translateY(2px); border-bottom-width: 2px; }
        .key.black:active { border-bottom-width: 1px; }

        .accomp-panel { width: 100%; max-width: 1000px; margin-top: 10px; background: rgba(24, 24, 27, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 15px; backdrop-filter: blur(10px); box-sizing: border-box; }
        .accomp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .accomp-header h3 { margin: 0; font-size: 1.1rem; color: #e4e4e7; font-weight: 700; }
        .accomp-controls-group { display: flex; gap: 10px; }
        .accomp-controls-group select { padding: 8px 12px; font-size: 13px; min-width: auto; margin: 0; }
        .accomp-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding-bottom: 5px; }
        
        .chord-btn { flex: 1 1 20%; min-width: 70px; max-width: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 0; background: linear-gradient(to bottom, #27272a, #18181b); border: 1px solid #3f3f46; border-bottom: 4px solid #000; border-radius: 8px; color: #f8fafc; font-family: 'Outfit', sans-serif; cursor: pointer; user-select: none; transition: all 0.1s; box-shadow: 0 4px 6px rgba(0,0,0,0.5); -webkit-tap-highlight-color: transparent; }
        .chord-numeral { font-size: 1.3rem; font-weight: 800; }
        .chord-name { font-size: 0.8rem; font-weight: 600; opacity: 0.6; margin-top: 2px; }
        .chord-btn:active, .chord-btn.pressed { transform: translateY(3px); border-bottom-width: 1px; background: var(--main-active); border-color: #7c3aed; box-shadow: 0 0 15px rgba(167, 139, 250, 0.5), inset 0 2px 5px rgba(255, 255, 255, 0.3); color: white; }
        .chord-btn:active .chord-name, .chord-btn.pressed .chord-name { opacity: 1; }

        .footer-signature { margin-top: 40px; font-size: 0.85rem; font-weight: 400; color: #71717a; letter-spacing: 0.5px; opacity: 0.8; transition: opacity 0.3s ease; }
        .footer-signature:hover { opacity: 1; }
        .footer-signature .name { font-weight: 700; background: linear-gradient(135deg, #a78bfa, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        @media (max-width: 768px) and (orientation: portrait) {
            body { padding: 10px 5px; justify-content: flex-start; }
            h1 { font-size: 1.4rem; margin-bottom: 5px; }
            .legend { font-size: 11px; gap: 8px; padding: 4px 10px; margin-bottom: 10px; }
            .controls { gap: 6px; margin-bottom: 10px; }
            select { padding: 6px 10px; font-size: 13px; }
            .switches-wrapper { gap: 15px; margin-bottom: 15px; flex-wrap: wrap;}
            .switch-label { font-size: 13px; }
            
            .tuner-panel { padding: 10px 15px; margin-bottom: 15px; }
            .tuner-note-display { font-size: 2rem; }
            .tuner-status { font-size: 0.85rem; }
            
            .tuner-gauge-blob { height: 20px; }
            .tuner-blob { width: 34px; }
            
            .scale-title { font-size: 1rem; margin-bottom: 10px; }
            .piano { padding: 4px; }
            .key.white { width: 36px; height: 130px; margin-right: 1px; border-radius: 0 0 4px 4px; }
            .key.black { width: 22px; height: 80px; left: 26px; border-radius: 0 0 4px 4px; }
            .key { padding-bottom: 6px; }
            .degree { font-size: 13px; }
            .note-name { font-size: 9px; margin-bottom: 2px; }
            .key.black .degree { font-size: 11px; }
            .key.black .note-name { font-size: 7px; }
            
            .accomp-panel { padding: 10px; margin-top: 5px; }
            .accomp-header { flex-direction: column; gap: 10px; margin-bottom: 12px; align-items: center; }
            .accomp-header h3 { font-size: 1.05rem; }
            .accomp-controls-group { width: 100%; display: flex; gap: 5px; }
            .accomp-controls-group select { flex: 1; padding: 8px 5px; font-size: 11.5px; text-align: center; }
            .accomp-buttons { gap: 8px; }
            .chord-btn { flex: 1 1 25%; min-width: 55px; max-width: 90px; padding: 8px 0; border-radius: 6px; }
            .chord-numeral { font-size: 1.1rem; }
            .chord-name { font-size: 0.75rem; margin-top: 1px; }
            .footer-signature { margin-top: 15px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <h1>Vocal TAB: Guía de Escalas</h1>

    <div class="legend">
        <span><div class="dot lower"></div> Graves (-1)</span>
        <span><div class="dot main"></div> Melodía (1)</span>
        <span><div class="dot upper"></div> Agudos (1+)</span>
        <span><div class="dot tessitura"></div> Rango Vocal</span>
    </div>

    <div class="controls">
        <select id="voice-selector">
            <option value="none">Rango Vocal: Ninguno</option>
            <option value="24,45">Soprano (C4 - A5)</option>
            <option value="21,41">Mezzo-Soprano (A3 - F5)</option>
            <option value="17,38">Contralto (F3 - D5)</option>
            <option value="12,33">Tenor (C3 - A4)</option>
            <option value="7,28">Barítono (G2 - E4)</option>
            <option value="4,24">Bajo (E2 - C4)</option>
        </select>

        <select id="main-instrument">
            <option value="acoustic_grand_piano" selected>Melodía: Grand Piano</option>
            <option value="electric_piano_1">Melodía: Rhodes</option>
            <option value="mixed_piano">Melodía: Piano + Rhodes</option>
        </select>

        <select id="note-selector">
            <option value="0" data-letter="C">Do (C)</option>
            <option value="2" data-letter="D">Re (D)</option>
            <option value="4" data-letter="E">Mi (E)</option>
            <option value="5" data-letter="F">Fa (F)</option>
            <option value="7" data-letter="G">Sol (G)</option>
            <option value="9" data-letter="A">La (A)</option>
            <option value="11" data-letter="B">Si (B)</option>
        </select>

        <select id="accidental-selector">
            <option value="0" data-char="">Natural (♮)</option>
            <option value="-1" data-char="b">Bemol (b)</option>
            <option value="1" data-char="#">Sostenido (#)</option>
        </select>

        <select id="type-selector">
            <option value="Mayor">Mayor</option>
            <option value="Menor (Natural)">Menor (Natural)</option>
            <option value="Menor (Armónica)">Menor (Armónica)</option>
            <option value="Pentatónica Mayor">Pentatónica Mayor</option>
            <option value="Pentatónica Menor">Pentatónica Menor</option>
        </select>

        <select id="octave-selector">
            <option value="1">Octava 3 (C3)</option>
            <option value="2" selected>Octava 4 (C4 Central)</option>
            <option value="3">Octava 5 (C5)</option>
        </select>
    </div>

    <div class="switches-wrapper">
        <div class="switch-container">
            <label class="switch">
                <input type="checkbox" id="sustain-toggle">
                <span class="slider"></span>
            </label>
            <span class="switch-label">Sustain</span>
        </div>
        
        <div class="switch-container">
            <label class="switch">
                <input type="checkbox" id="tuner-toggle">
                <span class="slider"></span>
            </label>
            <span class="switch-label">Afinador (Mic)</span>
        </div>
    </div>

    <div id="tuner-panel" class="tuner-panel">
        <div class="tuner-header">
            <div id="tuner-note" class="tuner-note-display">--</div>
            <div id="tuner-status" class="tuner-status">Esperando...</div>
        </div>
        
        <div class="tuner-gauge-blob">
            <div id="tuner-blob" class="tuner-blob"></div>
        </div>
        
        <div class="tuner-labels">
            <span>♭ Bemol</span>
            <span>Centro</span>
            <span>Sostenido ♯</span>
        </div>
    </div>

    <div id="scale-title" class="scale-title">Escala Mayor de C</div>

    <div class="piano-scroll-wrapper" id="scroll-wrapper">
        <div class="piano" id="piano-container"></div>
    </div>

    <div class="accomp-panel">
        <div class="accomp-header">
            <h3>Acompañamiento</h3>
            <div class="accomp-controls-group">
                <select id="accomp-instrument">
                    <option value="electric_piano_1" selected>Acordes: Solo Rhodes</option>
                    <option value="acoustic_grand_piano">Acordes: Solo Grand Piano</option>
                    <option value="mixed_piano">Acordes: Piano + Rhodes</option>
                </select>
                <select id="accomp-octave">
                    <option value="0">Octava 2 (Graves)</option>
                    <option value="1" selected>Octava 3 (Medios)</option>
                    <option value="2">Octava 4 (Agudos)</option>
                </select>
            </div>
        </div>
        <div id="accomp-buttons" class="accomp-buttons"></div>
    </div>

    <div class="footer-signature">
        By: <span class="name">Luis Guarin</span>
    </div>

    <script>
        // --- CONFIGURACIÓN MAESTRA DE AFINACIÓN ---
        const MASTER_TUNE_A = 440.0; // Frecuencia de calibración La4 estándar
        const SAMPLES_CORRECTION_CENTS = -5; // Compensación para los mp3 que suelen ser ligeramente altos

        let audioCtx;
        let masterCompressor;
        
        const audioBuffers = { 'acoustic_grand_piano': {}, 'electric_piano_1': {} };
        let isAudioLoaded = false;
        let isAudioLoading = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterCompressor = audioCtx.createDynamicsCompressor();
                masterCompressor.threshold.value = -5;
                masterCompressor.knee.value = 15;
                masterCompressor.ratio.value = 12;
                masterCompressor.attack.value = 0.02;
                masterCompressor.release.value = 0.25;
                masterCompressor.connect(audioCtx.destination);
            }
        }

        async function loadRealAudioSamples() {
            if (isAudioLoaded || isAudioLoading) return;
            isAudioLoading = true;
            initAudio();
            const notesToLoad = ['C2', 'C3', 'C4', 'C5', 'C6', 'C7'];
            const instruments = ['acoustic_grand_piano', 'electric_piano_1'];
            const baseUrl = 'https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/';

            try {
                const loadPromises = [];
                instruments.forEach(inst => {
                    notesToLoad.forEach(note => {
                        const p = fetch(`${baseUrl}${inst}-mp3/${note}.mp3`)
                            .then(response => response.arrayBuffer())
                            .then(ab => audioCtx.decodeAudioData(ab))
                            .then(buffer => { audioBuffers[inst][note] = buffer; });
                        loadPromises.push(p);
                    });
                });
                await Promise.all(loadPromises);
                isAudioLoaded = true;
            } catch (error) {
                console.error("Error al cargar samples.", error);
            }
        }
        document.body.addEventListener('pointerdown', loadRealAudioSamples, { once: true });

        const sustainToggle = document.getElementById('sustain-toggle');

        function playSound(noteIndex, forceSustain = false, instrument = 'acoustic_grand_piano') {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const now = audioCtx.currentTime;
            const isSustain = forceSustain || sustainToggle.checked;
            const realPianoDuration = isSustain ? 8 : 2;     
            const synthPianoDuration = isSustain ? 5 : 1.2;  

            if (isAudioLoaded) {
                let closestCIndex = Math.floor(noteIndex / 12) * 12;
                let semitonesDistance = noteIndex - closestCIndex;
                let octave = (closestCIndex / 12) + 2;
                
                if (octave < 2) { octave = 2; semitonesDistance = noteIndex; }
                if (octave > 7) { octave = 7; semitonesDistance = noteIndex - 60; }
                const sampleName = 'C' + octave;

                const playBufferLayer = (instName, volumeRatio) => {
                    const buffer = audioBuffers[instName] && audioBuffers[instName][sampleName];
                    if (buffer) {
                        const source = audioCtx.createBufferSource();
                        source.buffer = buffer;
                        
                        // CORRECCIÓN MAESTRA DE PITCH INYECTADA EN EL PLAYBACKRATE
                        let correctedDistance = semitonesDistance + (SAMPLES_CORRECTION_CENTS / 100);
                        source.playbackRate.value = Math.pow(2, correctedDistance / 12);
                        
                        const gainNode = audioCtx.createGain();
                        gainNode.gain.setValueAtTime(3.8 * volumeRatio, now); 
                        gainNode.gain.exponentialRampToValueAtTime(0.001, now + realPianoDuration); 
                        source.connect(gainNode);
                        gainNode.connect(masterCompressor);
                        source.start(0);
                    }
                };

                if (instrument === 'mixed_piano') {
                    playBufferLayer('acoustic_grand_piano', 1.0);
                    playBufferLayer('electric_piano_1', 0.7);
                } else {
                    playBufferLayer(instrument, 1.0);
                }
                return; 
            }

            // Fallback sintético calibrado a la frecuencia maestra
            const midiNote = 36 + noteIndex;
            const frequency = MASTER_TUNE_A * Math.pow(2, (midiNote - 69) / 12);
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'triangle'; 
            oscillator.frequency.value = frequency;
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(1.3, now + 0.02); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + synthPianoDuration); 

            oscillator.connect(gainNode);
            gainNode.connect(masterCompressor);
            oscillator.start(now);
            oscillator.stop(now + synthPianoDuration); 
        }

        const tunerToggle = document.getElementById('tuner-toggle');
        const tunerPanel = document.getElementById('tuner-panel');
        const tunerNoteDisplay = document.getElementById('tuner-note');
        const tunerStatusDisplay = document.getElementById('tuner-status');
        const tunerBlob = document.getElementById('tuner-blob');
        
        let audioStream = null;
        let analyser = null;
        let tunerAnimationId = null;
        let buf = new Float32Array(2048);
        
        let smoothedCents = 0;
        const lerpFactor = 0.04; // Burbuja más lenta y estable

        const noteNamesGlobal = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

        function startTuner() {
            initAudio();
            navigator.mediaDevices.getUserMedia({ audio: {
                echoCancellation: false,
                autoGainControl: false,
                noiseSuppression: false
            }}).then(stream => {
                audioStream = stream;
                const source = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                source.connect(analyser);
                
                tunerPanel.classList.add('active');
                smoothedCents = 0; 
                updateTuner();
            }).catch(err => {
                alert("Para usar el afinador, necesitas dar permisos de micrófono al navegador.");
                tunerToggle.checked = false;
            });
        }

        function stopTuner() {
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }
            if (tunerAnimationId) {
                cancelAnimationFrame(tunerAnimationId);
            }
            tunerPanel.classList.remove('active');
            document.querySelectorAll('.key.voice-active').forEach(k => k.classList.remove('voice-active'));
        }

        tunerToggle.addEventListener('change', (e) => {
            if (e.target.checked) startTuner();
            else stopTuner();
        });

        function autoCorrelate(buf, sampleRate) {
            let SIZE = buf.length;
            let rms = 0;
            for (let i = 0; i < SIZE; i++) {
                let val = buf[i];
                rms += val * val;
            }
            rms = Math.sqrt(rms / SIZE);
            if (rms < 0.01) return -1; 

            let r1 = 0, r2 = SIZE - 1, thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++)
                if (Math.abs(buf[i]) < thres) { r1 = i; break; }
            for (let i = 1; i < SIZE / 2; i++)
                if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }

            buf = buf.slice(r1, r2);
            SIZE = buf.length;

            let c = new Array(SIZE).fill(0);
            for (let i = 0; i < SIZE; i++)
                for (let j = 0; j < SIZE - i; j++)
                    c[i] = c[i] + buf[j] * buf[j + i];

            let d = 0; while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
            }
            let T0 = maxpos;

            let x0 = c[T0], x1 = c[T0 - 1], x2 = c[T0 + 1];
            let a = (x1 + x2 - 2 * x0) / 2;
            let b = (x2 - x1) / 2;
            if (a) T0 = T0 - b / (2 * a);

            return sampleRate / T0;
        }

        function updateTuner() {
            analyser.getFloatTimeDomainData(buf);
            const pitch = autoCorrelate(buf, audioCtx.sampleRate);
            
            document.querySelectorAll('.key.voice-active').forEach(k => k.classList.remove('voice-active'));

            if (pitch !== -1) {
                let note = Math.round(12 * (Math.log2(pitch / MASTER_TUNE_A)) + 69);
                if (note >= 24 && note <= 90) { 
                    let targetFrequency = MASTER_TUNE_A * Math.pow(2, (note - 69) / 12);
                    let rawCents = 1200 * Math.log2(pitch / targetFrequency);
                    
                    smoothedCents = smoothedCents + (rawCents - smoothedCents) * lerpFactor;
                    
                    let noteName = noteNamesGlobal[note % 12];
                    let octave = Math.floor(note / 12) - 1;
                    tunerNoteDisplay.textContent = `${noteName}${octave}`;

                    // AMPLIADO EL RANGO VISUAL A +-75 CENTS
                    let displayCents = Math.max(-75, Math.min(75, smoothedCents));
                    let leftPercent = ((displayCents + 75) / 150) * 100; 
                    
                    tunerBlob.style.left = `${leftPercent}%`;

                    if (Math.abs(smoothedCents) <= 10) { 
                        tunerBlob.style.backgroundColor = '#22c55e'; 
                        tunerBlob.style.boxShadow = '0 0 15px #22c55e';
                        tunerNoteDisplay.style.color = '#22c55e';
                        tunerStatusDisplay.textContent = "Perfecto";
                        tunerStatusDisplay.style.color = '#22c55e';
                    } else if (smoothedCents < -10) { 
                        tunerBlob.style.backgroundColor = '#ef4444'; 
                        tunerBlob.style.boxShadow = '0 0 15px #ef4444';
                        tunerNoteDisplay.style.color = '#fca5a5';
                        tunerStatusDisplay.textContent = "♭ Bemol";
                        tunerStatusDisplay.style.color = '#fca5a5';
                    } else { 
                        tunerBlob.style.backgroundColor = '#eab308'; 
                        tunerBlob.style.boxShadow = '0 0 15px #eab308';
                        tunerNoteDisplay.style.color = '#fde047';
                        tunerStatusDisplay.textContent = "Sostenido ♯";
                        tunerStatusDisplay.style.color = '#fde047';
                    }

                    const pianoNoteIndex = note - 36; 
                    if (pianoNoteIndex >= 0 && pianoNoteIndex < totalNotes) {
                        const targetKey = document.querySelector(`.key[data-note="${pianoNoteIndex}"]`);
                        if (targetKey) {
                            targetKey.classList.add('voice-active');
                        }
                    }
                }
            } else {
                smoothedCents = smoothedCents * 0.95; 
                tunerNoteDisplay.textContent = "--";
                tunerNoteDisplay.style.color = "#52525b";
                tunerStatusDisplay.textContent = "Escuchando...";
                tunerStatusDisplay.style.color = "#52525b";
                
                tunerBlob.style.left = '50%';
                tunerBlob.style.backgroundColor = '#52525b';
                tunerBlob.style.boxShadow = 'none';
            }

            if (tunerToggle.checked) {
                tunerAnimationId = requestAnimationFrame(updateTuner);
            }
        }

        const formulas = {
            "Mayor": [0, 2, 4, 5, 7, 9, 11],     
            "Menor (Natural)": [0, 2, 3, 5, 7, 8, 10],     
            "Menor (Armónica)": [0, 2, 3, 5, 7, 8, 11],
            "Pentatónica Mayor": [0, 2, 4, 7, 9],
            "Pentatónica Menor": [0, 3, 5, 7, 10]
        };

        const letters = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
        const intervalToDiatonicStep = { 0:0, 1:1, 2:1, 3:2, 4:2, 5:3, 6:3, 7:4, 8:5, 9:5, 10:6, 11:6 };
        const pitchMap = {
            0: ['C', 'B#', 'Dbb'], 1: ['Db', 'C#', 'Bx'], 2: ['D', 'Cx', 'Ebb'],
            3: ['Eb', 'D#', 'Fbb'], 4: ['E', 'Fb', 'Dx'], 5: ['F', 'E#', 'Gbb'],
            6: ['Gb', 'F#', 'Ex'], 7: ['G', 'Fx', 'Abb'], 8: ['Ab', 'G#'],
            9: ['A', 'Gx', 'Bbb'], 10: ['Bb', 'A#', 'Cbb'], 11: ['B', 'Cb', 'Ax']
        };
        const chordTemplates = {
            "Mayor": ["I", "ii", "iii", "IV", "V", "vi", "vii°"],
            "Menor (Natural)": ["i", "ii°", "III", "iv", "v", "VI", "VII"],
            "Menor (Armónica)": ["i", "ii°", "III+", "iv", "V", "VI", "vii°"],
            "Pentatónica Mayor": ["I", "ii", "iii", "V", "vi"],
            "Pentatónica Menor": ["i", "III", "iv", "v", "VII"]
        };
        const chordFormulas = {
            "I": [0, 4, 7], "IV": [0, 4, 7], "V": [0, 4, 7], "III": [0, 4, 7], "VI": [0, 4, 7], "VII": [0, 4, 7],
            "ii": [0, 3, 7], "iii": [0, 3, 7], "vi": [0, 3, 7], "i": [0, 3, 7], "iv": [0, 3, 7], "v": [0, 3, 7],
            "vii°": [0, 3, 6], "ii°": [0, 3, 6], "III+": [0, 4, 8]
        };

        const pianoContainer = document.getElementById('piano-container');
        const scrollWrapper = document.getElementById('scroll-wrapper');
        const mainInstSelector = document.getElementById('main-instrument');
        const numOctaves = 5; 
        const totalNotes = numOctaves * 12 + 1; 
        const blackKeyIndices = [1, 3, 6, 8, 10]; 

        function bindPressEffect(element) {
            element.addEventListener('pointerdown', () => element.classList.add('pressed'));
            element.addEventListener('pointerup', () => element.classList.remove('pressed'));
            element.addEventListener('pointerleave', () => element.classList.remove('pressed'));
            element.addEventListener('pointercancel', () => element.classList.remove('pressed'));
        }

        for (let i = 0; i < totalNotes; i++) {
            const noteInOctave = i % 12;
            const isBlack = blackKeyIndices.includes(noteInOctave);

            if (!isBlack) {
                const wrapper = document.createElement('div');
                wrapper.className = 'key-wrapper';

                const whiteKey = document.createElement('div');
                whiteKey.className = 'key white';
                whiteKey.dataset.note = i;
                whiteKey.addEventListener('pointerdown', () => playSound(i, false, mainInstSelector.value));
                bindPressEffect(whiteKey); 
                wrapper.appendChild(whiteKey);

                const nextNote = i + 1;
                const nextNoteInOctave = nextNote % 12;
                
                if (nextNote < totalNotes && blackKeyIndices.includes(nextNoteInOctave)) {
                    const blackKey = document.createElement('div');
                    blackKey.className = 'key black';
                    blackKey.dataset.note = nextNote;
                    blackKey.addEventListener('pointerdown', () => playSound(nextNote, false, mainInstSelector.value));
                    bindPressEffect(blackKey); 
                    wrapper.appendChild(blackKey);
                }
                pianoContainer.appendChild(wrapper);
            }
        }

        const voiceSelector = document.getElementById('voice-selector');
        const noteSelector = document.getElementById('note-selector');
        const accidentalSelector = document.getElementById('accidental-selector');
        const typeSelector = document.getElementById('type-selector');
        const octaveSelector = document.getElementById('octave-selector');
        const scaleTitle = document.getElementById('scale-title');
        const accompOctaveSelector = document.getElementById('accomp-octave');
        const accompInstSelector = document.getElementById('accomp-instrument');

        function centerPianoOnScale(rootIndex) {
            const startKey = document.querySelector(`.key[data-note="${rootIndex}"]`);
            const endKey = document.querySelector(`.key[data-note="${rootIndex + 12}"]`); 
            if (startKey && endKey) {
                const startWrapper = startKey.closest('.key-wrapper');
                const endWrapper = endKey.closest('.key-wrapper');
                const centerPos = (startWrapper.offsetLeft + endWrapper.offsetLeft + endWrapper.clientWidth) / 2;
                scrollWrapper.scrollTo({ left: centerPos - (scrollWrapper.clientWidth / 2), behavior: 'smooth' });
            } else if (startKey) {
                const startWrapper = startKey.closest('.key-wrapper');
                scrollWrapper.scrollTo({ left: startWrapper.offsetLeft - (scrollWrapper.clientWidth / 2) + (startWrapper.clientWidth / 2), behavior: 'smooth' });
            }
        }

        function renderTessitura() {
            document.querySelectorAll('.key').forEach(key => key.classList.remove('tessitura'));
            const range = voiceSelector.value;
            if (range === 'none') return;
            const [min, max] = range.split(',').map(Number);
            for(let i = min; i <= max; i++) {
                const key = document.querySelector(`.key[data-note="${i}"]`);
                if(key) key.classList.add('tessitura');
            }
        }

        function renderAccompaniment() {
            const accompContainer = document.getElementById('accomp-buttons');
            accompContainer.innerHTML = ''; 
            
            const scaleType = typeSelector.value;
            const currentFormula = formulas[scaleType]; 
            const basePitch = parseInt(noteSelector.value);
            const accidentalOffset = parseInt(accidentalSelector.value);
            const rootPitch = (basePitch + accidentalOffset + 12) % 12;
            const accompOctave = parseInt(accompOctaveSelector.value);
            const accompRootIndex = (accompOctave * 12) + rootPitch;
            
            const chordsToGenerate = chordTemplates[scaleType];
            const rootLetterIndex = letters.indexOf(noteSelector.options[noteSelector.selectedIndex].dataset.letter);
            
            chordsToGenerate.forEach((chordNumeral, index) => {
                const btn = document.createElement('div');
                btn.className = 'chord-btn';
                
                const intervalFromScaleRoot = currentFormula[index];
                const chordRootIndex = accompRootIndex + intervalFromScaleRoot;
                const chordTypeNotes = chordFormulas[chordNumeral];
                
                const diatonicStep = intervalToDiatonicStep[intervalFromScaleRoot];
                const expectedLetter = letters[(rootLetterIndex + diatonicStep) % 7];
                const actualPitch = chordRootIndex % 12;
                
                let rootNoteName = pitchMap[actualPitch].find(n => n.startsWith(expectedLetter)) || pitchMap[actualPitch][0]; 

                let suffix = chordNumeral.includes("°") ? "dim" : chordNumeral.includes("+") ? "aug" : chordNumeral === chordNumeral.toLowerCase() ? "m" : ""; 
                
                btn.innerHTML = `<div class="chord-numeral">${chordNumeral}</div><div class="chord-name">${rootNoteName}${suffix}</div>`;
                
                btn.addEventListener('pointerdown', () => {
                    btn.classList.add('pressed');
                    chordTypeNotes.forEach(interval => playSound(chordRootIndex + interval, true, accompInstSelector.value));
                });
                ['pointerup', 'pointerleave', 'pointercancel'].forEach(e => btn.addEventListener(e, () => btn.classList.remove('pressed')));
                
                accompContainer.appendChild(btn);
            });
        }

        function renderScale() {
            const basePitch = parseInt(noteSelector.value);
            const accidentalOffset = parseInt(accidentalSelector.value);
            const rootPitch = (basePitch + accidentalOffset + 12) % 12;
            const scaleType = typeSelector.value;
            const baseOctave = parseInt(octaveSelector.value);
            const currentFormula = formulas[scaleType];
            const rootLetterIndex = letters.indexOf(noteSelector.options[noteSelector.selectedIndex].dataset.letter);
            
            scaleTitle.textContent = `Escala ${scaleType} de ${noteSelector.options[noteSelector.selectedIndex].dataset.letter}${accidentalSelector.options[accidentalSelector.selectedIndex].dataset.char}`;

            document.querySelectorAll('.key').forEach(key => { key.className = key.className.replace(/active|main|upper|lower/g, '').trim(); key.innerHTML = ''; });

            for (let octOffset = -1; octOffset <= 1; octOffset++) {
                const rootIndex = (baseOctave + octOffset) * 12 + rootPitch;
                currentFormula.map(interval => rootIndex + interval).forEach((noteIndex, i) => {
                    const keyElement = document.querySelector(`.key[data-note="${noteIndex}"]`);
                    if (keyElement) {
                        keyElement.classList.add('active', octOffset === 0 ? 'main' : octOffset === 1 ? 'upper' : 'lower');
                        let degreeText = (octOffset === 1) ? `${i+1}+` : (octOffset === -1) ? `-${i+1}` : `${i+1}`;
                        const expectedLetter = letters[(rootLetterIndex + intervalToDiatonicStep[currentFormula[i]]) % 7];
                        let noteName = pitchMap[noteIndex % 12].find(n => n.startsWith(expectedLetter)) || pitchMap[noteIndex % 12][0]; 
                        keyElement.innerHTML = `<span class="note-name">${noteName}</span><span class="degree">${degreeText}</span>`;
                    }
                });
            }
            renderTessitura(); renderAccompaniment();
            setTimeout(() => centerPianoOnScale((baseOctave * 12) + rootPitch), 50); 
        }

        voiceSelector.addEventListener('change', renderScale);
        noteSelector.addEventListener('change', renderScale);
        accidentalSelector.addEventListener('change', renderScale);
        typeSelector.addEventListener('change', renderScale);
        octaveSelector.addEventListener('change', renderScale);
        accompOctaveSelector.addEventListener('change', renderAccompaniment);
        setTimeout(renderScale, 50);
    </script>
</body>
</html>
