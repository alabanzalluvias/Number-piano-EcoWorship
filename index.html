<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vocal TAB: Guía de Escalas</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505; 
            --text-color: #f8fafc;
            
            --white-key: #ffffff;
            --black-key: #0f0f11;
            --white-key-text: #09090b;
            --black-key-text: #ffffff;
            --piano-bg: rgba(24, 24, 27, 0.6);

            --main-active: #a78bfa;   
            --upper-active: #fb7185;  
            --lower-active: #818cf8;  
            
            --tessitura-color: #38bdf8; 
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top, #18181b 0%, var(--bg-color) 100%);
            color: var(--text-color);
            margin: 0;
            padding: 30px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100dvh; 
        }

        h1 {
            font-weight: 800;
            font-size: 2rem;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #a78bfa, #f472b6, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            font-size: 14px;
            font-weight: 600;
            color: #a1a1aa;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            justify-content: center;
        }
        .legend span { display: flex; align-items: center; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        
        .dot.lower { background-color: var(--lower-active); box-shadow: 0 0 8px var(--lower-active); }
        .dot.main { background-color: var(--main-active); box-shadow: 0 0 12px var(--main-active); }
        .dot.upper { background-color: var(--upper-active); box-shadow: 0 0 8px var(--upper-active); }
        .dot.tessitura { background-color: var(--tessitura-color); border-radius: 2px; height: 4px; width: 16px; box-shadow: 0 0 8px var(--tessitura-color);}

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
            justify-content: center;
            width: 100%;
            max-width: 600px;
        }

        select {
            flex: 1 1 45%; 
            min-width: 120px;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background-color: rgba(24, 24, 27, 0.8);
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        #voice-selector {
            flex: 1 1 100%;
            border-color: rgba(56, 189, 248, 0.3);
            color: #bae6fd;
        }

        select:focus {
            border-color: var(--main-active);
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.3);
            transform: translateY(-2px);
        }
        
        #voice-selector:focus {
            border-color: var(--tessitura-color);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .scale-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #e4e4e7; 
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(167, 139, 250, 0.5);
        }

        .piano-scroll-wrapper {
            width: 100%;
            max-width: 1000px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 20px; 
            scrollbar-width: thin;
            scrollbar-color: #52525b transparent;
        }

        .piano {
            display: flex;
            position: relative;
            background: var(--piano-bg);
            padding: 6px;
            border-radius: 12px;
            width: max-content;
            margin: 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .key-wrapper {
            position: relative;
            display: flex; 
        }

        .key {
            display: flex;
            position: relative; 
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 12px; 
            box-sizing: border-box;
            user-select: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent; 
            touch-action: pan-x pan-y; 
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Dimensiones PC / Horizontal */
        .key.white {
            width: 48px; 
            height: 190px; 
            background: linear-gradient(to bottom, #ffffff 0%, #f4f4f5 100%);
            color: var(--white-key-text); 
            border: 1px solid #d4d4d8;
            border-bottom: 4px solid #a1a1aa;
            border-radius: 0 0 6px 6px;
            margin-right: 2px;
        }

        .key.black {
            width: 32px;
            height: 115px;
            background: linear-gradient(to bottom, #18181b 0%, #09090b 100%);
            color: var(--black-key-text); 
            position: absolute;
            top: 0;
            left: 33px; 
            border-radius: 0 0 6px 6px;
            z-index: 5; 
            border: 1px solid #000000;
            border-bottom: 3px solid #000000;
            box-shadow: 2px 5px 10px rgba(0,0,0,0.7); 
        }

        .key.tessitura::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(56, 189, 248, 0.15) 0%, transparent 60%);
            border-top: 4px solid var(--tessitura-color);
            border-radius: inherit;
            pointer-events: none;
            z-index: 2; 
        }
        
        .key.black.tessitura::before {
            border-top: 3px solid var(--tessitura-color);
            background: linear-gradient(to bottom, rgba(56, 189, 248, 0.3) 0%, transparent 60%);
        }

        .key.pressed::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.3);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.6);
            border-radius: inherit;
            pointer-events: none;
            z-index: 3;
        }

        .note-name, .degree {
            pointer-events: none; 
            z-index: 4; 
            position: relative;
        }

        .note-name {
            font-size: 12px;
            font-weight: 700;
            opacity: 0.9;
            line-height: 1;
            margin-bottom: 4px;
        }
        .degree {
            font-size: 18px;
            font-weight: 800;
            line-height: 1;
        }
        .key.black .note-name { font-size: 11px; margin-bottom: 3px; }
        .key.black .degree { font-size: 15px; }
        
        .key.white.active.main { 
            background: var(--main-active); color: #ffffff; border-color: #8b5cf6; border-bottom-color: #7c3aed;
            box-shadow: 0 0 25px rgba(167, 139, 250, 0.7), inset 0 2px 10px rgba(255, 255, 255, 0.4); 
        }
        .key.black.active.main { 
            background: linear-gradient(to bottom, #c084fc, var(--main-active)); color: #ffffff; border-color: #7c3aed; 
            box-shadow: 0 5px 20px rgba(167, 139, 250, 0.8);
        }
        
        .key.white.active.upper { 
            background: var(--upper-active); color: #ffffff; border-color: #f43f5e; border-bottom-color: #e11d48;
            box-shadow: 0 0 15px rgba(251, 113, 133, 0.5), inset 0 2px 10px rgba(255, 255, 255, 0.3);
        }
        .key.black.active.upper { 
            background: linear-gradient(to bottom, #fda4af, var(--upper-active)); color: #ffffff; border-color: #e11d48;
            box-shadow: 0 5px 15px rgba(251, 113, 133, 0.6);
        }
        
        .key.white.active.lower { 
            background: var(--lower-active); color: #ffffff; border-color: #6366f1; border-bottom-color: #4f46e5;
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.5), inset 0 2px 10px rgba(255, 255, 255, 0.3);
        }
        .key.black.active.lower { 
            background: linear-gradient(to bottom, #a5b4fc, var(--lower-active)); color: #ffffff; border-color: #4f46e5;
            box-shadow: 0 5px 15px rgba(129, 140, 248, 0.6);
        }
        
        .key:active { transform: translateY(2px); border-bottom-width: 2px; }
        .key.black:active { border-bottom-width: 1px; }

        .footer-signature {
            margin-top: 40px;
            font-size: 0.85rem;
            font-weight: 400;
            color: #71717a;
            letter-spacing: 0.5px;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }
        .footer-signature:hover {
            opacity: 1;
        }
        .footer-signature .name {
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 📱 OPTIMIZACIÓN AGRESIVA PARA CELULARES EN MODO VERTICAL */
        @media (max-width: 768px) and (orientation: portrait) {
            body {
                padding: 15px 5px;
                justify-content: flex-start;
            }
            h1 {
                font-size: 1.6rem;
                margin-bottom: 5px;
            }
            .legend {
                font-size: 11px;
                gap: 10px;
                padding: 6px 10px;
                margin-bottom: 12px;
            }
            .controls {
                gap: 8px;
                margin-bottom: 15px;
            }
            select {
                padding: 8px 12px;
                font-size: 14px;
            }
            .scale-title {
                font-size: 1.1rem;
                margin-bottom: 15px;
            }
            
            .piano {
                padding: 4px;
            }
            
            /* Teclas mucho más compactas para que quepa la octava en pantallas estrechas */
            .key.white {
                width: 38px; 
                height: 140px; 
                margin-right: 1px;
                border-radius: 0 0 4px 4px;
            }
            .key.black {
                width: 24px;
                height: 85px;
                left: 27px; /* 38(blanca) + 1(margen) = 39. Centro unión = 38.5. 38.5 - 12(mitad negra) = 26.5 => 27px */
                border-radius: 0 0 4px 4px;
            }
            
            /* Ajuste de fuentes para las teclas pequeñas */
            .key { padding-bottom: 8px; }
            .degree { font-size: 14px; }
            .note-name { font-size: 10px; margin-bottom: 2px; }
            .key.black .degree { font-size: 12px; }
            .key.black .note-name { font-size: 8px; }
            
            .footer-signature {
                margin-top: 20px;
                font-size: 0.75rem;
            }
        }

    </style>
</head>
<body>

    <h1>Vocal TAB: Guía de Escalas</h1>

    <div class="legend">
        <span><div class="dot lower"></div> Graves (-1)</span>
        <span><div class="dot main"></div> Melodía (1)</span>
        <span><div class="dot upper"></div> Agudos (1+)</span>
        <span><div class="dot tessitura"></div> Rango Vocal</span>
    </div>

    <div class="controls">
        <select id="voice-selector">
            <option value="none">Rango Vocal: Ninguno</option>
            <option value="24,45">Soprano (C4 - A5)</option>
            <option value="21,41">Mezzo-Soprano (A3 - F5)</option>
            <option value="17,38">Contralto (F3 - D5)</option>
            <option value="12,33">Tenor (C3 - A4)</option>
            <option value="7,28">Barítono (G2 - E4)</option>
            <option value="4,24">Bajo (E2 - C4)</option>
        </select>

        <select id="note-selector">
            <option value="0" data-letter="C">Do (C)</option>
            <option value="2" data-letter="D">Re (D)</option>
            <option value="4" data-letter="E">Mi (E)</option>
            <option value="5" data-letter="F">Fa (F)</option>
            <option value="7" data-letter="G">Sol (G)</option>
            <option value="9" data-letter="A">La (A)</option>
            <option value="11" data-letter="B">Si (B)</option>
        </select>

        <select id="accidental-selector">
            <option value="0" data-char="">Natural (♮)</option>
            <option value="-1" data-char="b">Bemol (b)</option>
            <option value="1" data-char="#">Sostenido (#)</option>
        </select>

        <select id="type-selector">
            <option value="Mayor">Mayor</option>
            <option value="Menor (Natural)">Menor (Natural)</option>
            <option value="Menor (Armónica)">Menor (Armónica)</option>
            <option value="Pentatónica Mayor">Pentatónica Mayor</option>
            <option value="Pentatónica Menor">Pentatónica Menor</option>
        </select>

        <select id="octave-selector">
            <option value="1">Octava 2 (C2)</option>
            <option value="2" selected>Octava 3 (Central)</option>
            <option value="3">Octava 4 (C4)</option>
        </select>
    </div>

    <div id="scale-title" class="scale-title">Escala Mayor de C</div>

    <div class="piano-scroll-wrapper" id="scroll-wrapper">
        <div class="piano" id="piano-container"></div>
    </div>

    <div class="footer-signature">
        By: <span class="name">Luis Guarin</span>
    </div>

    <script>
        let audioCtx;
        
        const pianoBuffers = {};
        let isPianoLoaded = false;
        let isPianoLoading = false;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        async function loadRealPianoSamples() {
            if (isPianoLoaded || isPianoLoading) return;
            isPianoLoading = true;
            initAudio();
            
            const notesToLoad = ['C2', 'C3', 'C4', 'C5', 'C6', 'C7'];
            const baseUrl = 'https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/acoustic_grand_piano-mp3/';

            try {
                const loadPromises = notesToLoad.map(async (note) => {
                    const response = await fetch(baseUrl + note + '.mp3');
                    const arrayBuffer = await response.arrayBuffer();
                    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                    pianoBuffers[note] = audioBuffer;
                });
                
                await Promise.all(loadPromises);
                isPianoLoaded = true;
            } catch (error) {
                console.error("No se pudieron cargar los samples del piano. Se usará el sintetizador.", error);
            }
        }

        document.body.addEventListener('pointerdown', loadRealPianoSamples, { once: true });

        function playSound(noteIndex) {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const now = audioCtx.currentTime;

            if (isPianoLoaded) {
                let closestCIndex = Math.floor(noteIndex / 12) * 12;
                let semitonesDistance = noteIndex - closestCIndex;
                let octave = (closestCIndex / 12) + 2;
                
                if (octave < 2) { octave = 2; semitonesDistance = noteIndex; }
                if (octave > 7) { octave = 7; semitonesDistance = noteIndex - 60; }
                
                const sampleName = 'C' + octave;
                const buffer = pianoBuffers[sampleName];

                if (buffer) {
                    const source = audioCtx.createBufferSource();
                    source.buffer = buffer;
                    
                    source.playbackRate.value = Math.pow(2, semitonesDistance / 12);
                    
                    const gainNode = audioCtx.createGain();
                    gainNode.gain.setValueAtTime(1.5, now); 
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 3); 
                    
                    source.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    source.start(0);
                    return; 
                }
            }

            const midiNote = 36 + noteIndex;
            const frequency = 440 * Math.pow(2, (midiNote - 69) / 12);

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'triangle'; 
            oscillator.frequency.value = frequency;

            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.6, now + 0.02); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 1.5); 

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start(now);
            oscillator.stop(now + 1.5); 
        }

        const formulas = {
            "Mayor": [0, 2, 4, 5, 7, 9, 11],     
            "Menor (Natural)": [0, 2, 3, 5, 7, 8, 10],     
            "Menor (Armónica)": [0, 2, 3, 5, 7, 8, 11],
            "Pentatónica Mayor": [0, 2, 4, 7, 9],
            "Pentatónica Menor": [0, 3, 5, 7, 10]
        };

        const letters = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
        
        const intervalToDiatonicStep = {
            0: 0, 1: 1, 2: 1, 3: 2, 4: 2, 5: 3, 6: 3, 
            7: 4, 8: 5, 9: 5, 10: 6, 11: 6 
        };

        const pitchMap = {
            0: ['C', 'B#', 'Dbb'], 1: ['Db', 'C#', 'Bx'], 2: ['D', 'Cx', 'Ebb'],
            3: ['Eb', 'D#', 'Fbb'], 4: ['E', 'Fb', 'Dx'], 5: ['F', 'E#', 'Gbb'],
            6: ['Gb', 'F#', 'Ex'], 7: ['G', 'Fx', 'Abb'], 8: ['Ab', 'G#'],
            9: ['A', 'Gx', 'Bbb'], 10: ['Bb', 'A#', 'Cbb'], 11: ['B', 'Cb', 'Ax']
        };

        const pianoContainer = document.getElementById('piano-container');
        const scrollWrapper = document.getElementById('scroll-wrapper');
        
        const numOctaves = 5; 
        const totalNotes = numOctaves * 12 + 1; 
        const blackKeyIndices = [1, 3, 6, 8, 10]; 

        function bindPressEffect(element) {
            element.addEventListener('pointerdown', () => element.classList.add('pressed'));
            element.addEventListener('pointerup', () => element.classList.remove('pressed'));
            element.addEventListener('pointerleave', () => element.classList.remove('pressed'));
            element.addEventListener('pointercancel', () => element.classList.remove('pressed'));
        }

        for (let i = 0; i < totalNotes; i++) {
            const noteInOctave = i % 12;
            const isBlack = blackKeyIndices.includes(noteInOctave);

            if (!isBlack) {
                const wrapper = document.createElement('div');
                wrapper.className = 'key-wrapper';

                const whiteKey = document.createElement('div');
                whiteKey.className = 'key white';
                whiteKey.dataset.note = i;
                whiteKey.addEventListener('pointerdown', () => playSound(i));
                bindPressEffect(whiteKey); 
                wrapper.appendChild(whiteKey);

                const nextNote = i + 1;
                const nextNoteInOctave = nextNote % 12;
                
                if (nextNote < totalNotes && blackKeyIndices.includes(nextNoteInOctave)) {
                    const blackKey = document.createElement('div');
                    blackKey.className = 'key black';
                    blackKey.dataset.note = nextNote;
                    blackKey.addEventListener('pointerdown', () => playSound(nextNote));
                    bindPressEffect(blackKey); 
                    wrapper.appendChild(blackKey);
                }
                pianoContainer.appendChild(wrapper);
            }
        }

        const voiceSelector = document.getElementById('voice-selector');
        const noteSelector = document.getElementById('note-selector');
        const accidentalSelector = document.getElementById('accidental-selector');
        const typeSelector = document.getElementById('type-selector');
        const octaveSelector = document.getElementById('octave-selector');
        const scaleTitle = document.getElementById('scale-title');

        // LÓGICA DE CENTRADO DINÁMICO
        function centerPianoOnScale(rootIndex) {
            const startKey = document.querySelector(`.key[data-note="${rootIndex}"]`);
            const endKey = document.querySelector(`.key[data-note="${rootIndex + 12}"]`); 
            
            if (startKey && endKey) {
                const startWrapper = startKey.closest('.key-wrapper');
                const endWrapper = endKey.closest('.key-wrapper');
                
                const startPos = startWrapper.offsetLeft;
                const endPos = endWrapper.offsetLeft + endWrapper.clientWidth;
                
                const centerPos = (startPos + endPos) / 2;
                
                const scrollTarget = centerPos - (scrollWrapper.clientWidth / 2);
                scrollWrapper.scrollTo({
                    left: scrollTarget,
                    behavior: 'smooth'
                });
            } else if (startKey) {
                const startWrapper = startKey.closest('.key-wrapper');
                const scrollTarget = startWrapper.offsetLeft - (scrollWrapper.clientWidth / 2) + (startWrapper.clientWidth / 2);
                scrollWrapper.scrollTo({
                    left: scrollTarget,
                    behavior: 'smooth'
                });
            }
        }

        function renderTessitura() {
            document.querySelectorAll('.key').forEach(key => key.classList.remove('tessitura'));
            
            const range = voiceSelector.value;
            if (range === 'none') return;

            const [min, max] = range.split(',').map(Number);
            
            for(let i = min; i <= max; i++) {
                const key = document.querySelector(`.key[data-note="${i}"]`);
                if(key) key.classList.add('tessitura');
            }
        }

        function renderScale() {
            const basePitch = parseInt(noteSelector.value);
            const accidentalOffset = parseInt(accidentalSelector.value);
            const rootPitch = (basePitch + accidentalOffset + 12) % 12;
            
            const scaleType = typeSelector.value;
            const baseOctave = parseInt(octaveSelector.value);
            const currentFormula = formulas[scaleType];

            const selectedNoteOption = noteSelector.options[noteSelector.selectedIndex];
            const rootLetter = selectedNoteOption.dataset.letter;
            const rootLetterIndex = letters.indexOf(rootLetter);
            const accidentalChar = accidentalSelector.options[accidentalSelector.selectedIndex].dataset.char;
            
            scaleTitle.textContent = `Escala ${scaleType} de ${rootLetter}${accidentalChar}`;

            document.querySelectorAll('.key').forEach(key => {
                key.className = key.className.replace(/active|main|upper|lower/g, '').trim();
                key.innerHTML = ''; 
            });

            for (let octOffset = -1; octOffset <= 1; octOffset++) {
                const rootIndex = (baseOctave + octOffset) * 12 + rootPitch;
                const activeNotes = currentFormula.map(interval => rootIndex + interval);

                activeNotes.forEach((noteIndex, i) => {
                    const keyElement = document.querySelector(`.key[data-note="${noteIndex}"]`);
                    
                    if (keyElement) {
                        keyElement.classList.add('active');
                        
                        const degreeNum = i + 1;
                        let degreeText = degreeNum;
                        if (octOffset === 1) degreeText = degreeNum + '+';
                        else if (octOffset === -1) degreeText = '-' + degreeNum;

                        const chromaticInterval = currentFormula[i];
                        const diatonicStep = intervalToDiatonicStep[chromaticInterval];
                        
                        const expectedLetterIndex = (rootLetterIndex + diatonicStep) % 7;
                        const expectedLetter = letters[expectedLetterIndex];
                        const actualPitch = noteIndex % 12;
                        
                        let noteName = pitchMap[actualPitch].find(n => n.startsWith(expectedLetter));
                        if (!noteName) noteName = pitchMap[actualPitch][0]; 

                        if (octOffset === 0) keyElement.classList.add('main');
                        else if (octOffset === 1) keyElement.classList.add('upper');
                        else if (octOffset === -1) keyElement.classList.add('lower');

                        keyElement.innerHTML = `<span class="note-name">${noteName}</span><span class="degree">${degreeText}</span>`;
                    }
                });
            }

            renderTessitura();

            // Centra la octava cada vez que se repinta la escala
            const mainTonicIndex = (baseOctave * 12) + rootPitch;
            setTimeout(() => centerPianoOnScale(mainTonicIndex), 50); 
        }

        window.addEventListener('resize', () => {
            setTimeout(() => {
                renderScale();
            }, 150); 
        });

        voiceSelector.addEventListener('change', renderScale);
        noteSelector.addEventListener('change', renderScale);
